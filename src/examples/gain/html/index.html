<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #2d2d2d;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-group {
            margin: 20px;
            text-align: center;
        }

        .slider {
            width: 200px;
            margin: 10px;
        }

        .value-display {
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>Gain Control</h1>
    <div class="control-group">
        <input type="range" class="slider" id="gainSlider" min="0" max="1" step="0.001" value="0">
        <div class="value-display">
            <span id="gainValue">0.0</span>
        </div>
    </div>

    <script>
        const gainSlider = document.getElementById('gainSlider');
        const gainValue = document.getElementById('gainValue');

        gainSlider.addEventListener('input', function () {
            console.log(this.value);
            const value = parseFloat(this.value);
            gainValue.textContent = value.toFixed(3);
            window.setParameterFromUI({
                paramIdx: 0,
                value: value
            });
        });

        // Simple generic function that will be called by the host
        function messageFromHost(msg) {
            let j = typeof msg === "string" ? JSON.parse(msg) : msg;
            console.log(j);

            if (j["command"] === "parameterChange") {
                gainSlider.value = j["data"]["value"];
                gainValue.textContent = parseFloat(j["data"]["value"]).toFixed(2);
            }
        }
    </script>
</body>

</html>
