<!DOCTYPE html>
<html>

<head>
    <style>
        /* Disable text selection globally */
        body {
            -webkit-user-select: none;
            /* Safari */
            -moz-user-select: none;
            /* Firefox */
            -ms-user-select: none;
            /* IE/Edge */
            user-select: none;
            /* Standard syntax */
            background: #2d2d2d;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            /* Ensure the body takes up the full viewport height */
            position: relative;
            /* Required for absolute positioning of the SVG */
        }

        .sliders-container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            /* Space between sliders */
            margin-top: 20px;
        }

        .control-group {
            text-align: center;
        }

        .value-display {
            margin-top: -20px;
        }

        rotary-slider {
            width: 100px;
            height: 100px;
        }

        .slider-label {
            font-size: 18px;
            margin-bottom: 5px;
            color: #dddddd;
        }

        /* Style for the SVG in the bottom right corner */
        .lattice-svg {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 50px;
        }
    </style>
</head>

<body>
    <div class="sliders-container">
        <!-- Max Delay Slider -->
        <div class="control-group">
            <div class="slider-label">Max Delay</div>
            <rotary-slider id="maxDelaySlider" min="0" max="5" value="2.5"></rotary-slider>
            <div class="value-display">
                <span id="maxDelayValue">2.5</span>
            </div>
        </div>

        <!-- LFO Frequency Slider -->
        <div class="control-group">
            <div class="slider-label">LFO Frequency</div>
            <rotary-slider id="lfoFrequencySlider" min="0" max="20" value="0.5"></rotary-slider>
            <div class="value-display">
                <span id="lfoFrequencyValue">0.5</span>
            </div>
        </div>

        <!-- Feedback Slider -->
        <div class="control-group">
            <div class="slider-label">Feedback</div>
            <rotary-slider id="feedbackSlider" min="0" max="1" value="0.7"></rotary-slider>
            <div class="value-display">
                <span id="feedbackValue">0.7</span>
            </div>
        </div>

        <!-- Gain Slider -->
        <div class="control-group">
            <div class="slider-label">Gain</div>
            <rotary-slider id="gainSlider" min="0" max="1" value="0.5"></rotary-slider>
            <div class="value-display">
                <span id="gainValue">0.5</span>
            </div>
        </div>
    </div>

    <!-- Add the SVG to the bottom right corner -->
    <div class="lattice-svg">

    </div>

    <script src="rotarySliderElement.js"></script>
    <script>
        // Function to be called when the window loads
        window.onload = function () {
            window.sendMessageFromUI("onEditorLoad");
        };
        // Function to handle slider value changes
        function handleSliderChange(sliderId, valueDisplayId, paramIdx) {
            const slider = document.getElementById(sliderId);
            const valueDisplay = document.getElementById(valueDisplayId);

            slider.addEventListener('value-change', function (event) {
                const value = event.detail.value;
                const gesture = event.detail.gesture;
                valueDisplay.textContent = value.toFixed(4); // Display value with 4 decimal places

                // Send the updated value to the host
                window.sendMessageFromUI({
                    paramIdx: paramIdx,
                    value: value,
                    gesture: gesture
                });
            });
        }

        // Set up event listeners for each slider
        handleSliderChange('maxDelaySlider', 'maxDelayValue', 0); // Max Delay
        handleSliderChange('lfoFrequencySlider', 'lfoFrequencyValue', 1); // LFO Frequency
        handleSliderChange('feedbackSlider', 'feedbackValue', 2); // Feedback
        handleSliderChange('gainSlider', 'gainValue', 3); // Gain

        // This callback will be triggered when the host sends a message
        function hostMessageCallback(msg) {
            let j = typeof msg === "string" ? JSON.parse(msg) : msg;
            console.log(j);

            if (j["command"] === "parameterChange") {
                const paramIdx = j["data"]["paramIdx"];
                const value = j["data"]["value"];

                // Update the corresponding slider
                const sliderIds = ["maxDelaySlider", "lfoFrequencySlider", "feedbackSlider", "gainSlider"];
                const slider = document.getElementById(sliderIds[paramIdx]);
                
                if (slider) {
                    slider.setAttribute('value', value);
                    console.log(value);
                }

                // Update the corresponding value display
                const valueDisplayIds = ["maxDelayValue", "lfoFrequencyValue", "feedbackValue", "gainValue"];
                const valueDisplay = document.getElementById(valueDisplayIds[paramIdx]);
                if (valueDisplay) {
                    valueDisplay.textContent = parseFloat(value).toFixed(4);
                }
            }
        }
    </script>
</body>

</html>
